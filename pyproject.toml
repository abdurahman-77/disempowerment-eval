[project]
name = "disempower-eval"
version = "0.1.0"
description = "Red-team benchmark for AI disempowerment patterns (reality, value-judgment, and action distortion)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.75",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
disempower-eval = "disempower_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disempower_eval"]
